<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ - Telegram Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b1e36;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .header-title {
            color: #29b6f6;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .wheel-container {
            position: relative;
            width: 330px;
            height: 330px;
            margin: 0 auto 25px auto;
        }

        canvas {
            width: 330px;
            height: 330px;
            border-radius: 50%;
        }

        .pin {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 24px solid #33b5e5;
            z-index: 10;
            filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.5));
        }

        button {
            background: linear-gradient(180deg, #1e88e5, #1565c0);
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 40px;
            border: 1px solid #42a5f5;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(21, 101, 192, 0.4);
            transition: all 0.2s ease;
        }

        button:active {
            transform: scale(0.96);
        }

        button:disabled {
            background: #2a3b50;
            border-color: #37474f;
            color: #78909c;
            box-shadow: none;
            cursor: not-allowed;
        }

        #result {
            margin-top: 20px;
            font-size: 17px;
            font-weight: bold;
            min-height: 25px;
        }
        .win-text { color: #00e676; }
        .lose-text { color: #ff5252; }
    </style>
</head>
<body>

    <div class="header-title">
        <span>عجلة الحظ التفاعلية</span>
    </div>
    
    <div class="wheel-container">
        <div class="pin"></div>
        <canvas id="wheel"></canvas>
    </div>

    <button id="spinBtn" onclick="spinWheel()">لف الآن</button>
    <div id="result"></div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
        }

        // قراءة عدد اللفات الحقيقي تلقائياً من رابط الـ URL الذي يرسله البوت
        const urlParams = new URLSearchParams(window.location.search);
        let userSpins = parseInt(urlParams.get('spins')) || 0; 

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");

        const dpr = window.devicePixelRatio || 1;
        const size = 330;
        canvas.width = size * dpr;
        canvas.height = size * dpr;
        ctx.scale(dpr, dpr);

        const center = size / 2;
        const radius = 150;
        const innerRadius = 45;

        // قائمة الجوائز في العجلة (1% رصيد، 1% لفة مجانية، 98% حظ أوفر)
        const prizes = [
            { name: "5,000\nNSP", icon: "wallet", type: "bal", val: 5000 },       // الفهرس 0 (نسبة 1%)
            { name: "حظ أوفر\n😔", icon: "redo", type: "no_win", val: 0 },          // الفهرس 1 (نسبة 98% موزعة)
            { name: "حظ أوفر\n😔", icon: "redo", type: "no_win", val: 0 },          // الفهرس 2
            { name: "حظ أوفر\n😔", icon: "redo", type: "no_win", val: 0 },          // الفهرس 3
            { name: "حظ أوفر\n😔", icon: "redo", type: "no_win", val: 0 },          // الفهرس 4
            { name: "حظ أوفر\n😔", icon: "redo", type: "no_win", val: 0 },          // الفهرس 5
            { name: "حظ أوفر\n😔", icon: "redo", type: "no_win", val: 0 },          // الفهرس 6
            { name: "حظ أوفر\n😔", icon: "redo", type: "no_win", val: 0 },          // الفهرس 7
            { name: "حظ أوفر\n😔", icon: "redo", type: "no_win", val: 0 },          // الفهرس 8
            { name: "لفة\nمجانية", icon: "spin", type: "freespin", val: 1 }        // الفهرس 9 (نسبة 1%)
        ];

        const colors = [
            "#1c314e", "#25436c", "#1c314e", "#25436c", "#1c314e", 
            "#25436c", "#1c314e", "#25436c", "#1c314e", "#25436c"
        ];

        const numPrizes = prizes.length;
        const arc = (2 * Math.PI) / numPrizes;
        
        let startAngle = 0;
        let isSpinning = false;

        function drawIcon(type, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.strokeStyle = "#ffffff";
            ctx.fillStyle = "#ffffff";
            ctx.lineWidth = 1.8;
            ctx.lineJoin = "round";
            ctx.lineCap = "round";

            if (type === "wallet") {
                ctx.strokeRect(-7, -5, 14, 10);
                ctx.fillRect(2, -2, 3, 4);
            } else if (type === "redo" || type === "spin") {
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 1.5);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(3, -8); ctx.lineTo(6, -5); ctx.lineTo(3, -2);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawWheel() {
            ctx.clearRect(0, 0, size, size);

            ctx.beginPath();
            ctx.arc(center, center, radius, 0, 2 * Math.PI);
            ctx.fillStyle = "#102a45";
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#29b6f6";
            ctx.stroke();

            const dotsCount = 40;
            for (let d = 0; d < dotsCount; d++) {
                let dotAngle = (d * 2 * Math.PI) / dotsCount;
                let dotX = center + Math.cos(dotAngle) * (radius - 8);
                let dotY = center + Math.sin(dotAngle) * (radius - 8);
                ctx.beginPath();
                ctx.arc(dotX, dotY, 2.5, 0, 2 * Math.PI);
                ctx.fillStyle = "#ffffff";
                ctx.fill();
            }

            const innerSectorRadius = radius - 16;

            for (let i = 0; i < numPrizes; i++) {
                let angle = startAngle + i * arc;
                
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.arc(center, center, innerSectorRadius, angle, angle + arc, false);
                ctx.arc(center, center, innerRadius, angle + arc, angle, true);
                ctx.fill();
                ctx.lineWidth = 1;
                ctx.strokeStyle = "#15293d";
                ctx.stroke();

                ctx.save();
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 11px 'Segoe UI', Tahoma, sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                let textAngle = angle + arc / 2;
                let contentRadius = (innerSectorRadius + innerRadius) / 2 + 5;
                
                let cx = center + Math.cos(textAngle) * contentRadius;
                let cy = center + Math.sin(textAngle) * contentRadius;

                ctx.translate(cx, cy);
                ctx.rotate(textAngle + Math.PI / 2);

                drawIcon(prizes[i].icon, 0, -18, 12);

                let lines = prizes[i].name.split('\n');
                if (lines.length > 1) {
                    ctx.fillText(lines[0], 0, 2);
                    ctx.fillText(lines[1], 0, 14);
                } else {
                    ctx.fillText(lines[0], 0, 6);
                }

                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(center, center, innerRadius, 0, 2 * Math.PI);
            ctx.fillStyle = "rgba(16, 42, 69, 0.9)";
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#29b6f6";
            ctx.stroke();
            
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 16px 'Segoe UI', Tahoma, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("لف", center, center - 6);

            ctx.fillStyle = userSpins > 0 ? "#81c784" : "#80deea";
            ctx.font = "9px 'Segoe UI', Tahoma, sans-serif";
            ctx.fillText(userSpins > 0 ? `اللفات: ${userSpins}` : "لا توجد لفة", center, center + 12);
        }

        function spinWheel() {
            if (userSpins <= 0) {
                alert("⚠️ عذراً، ليس لديك لفات متبقية في رصيدك لتشغيل العجلة!");
                return;
            }

            if (isSpinning) return;
            isSpinning = true;
            document.getElementById("spinBtn").disabled = true;
            document.getElementById("result").innerText = "";

            userSpins--;
            drawWheel();

            let selectedIndex;
            const rand = Math.random();

            // توزيع النسب البرمجية الدقيقة:
            if (rand < 0.01) {
                selectedIndex = 0; // 5,000 NSP بنسبة 1%
            } else if (rand < 0.02) {
                selectedIndex = 9; // لفة مجانية بنسبة 1%
            } else {
                // اختيار عشوائي لأحد أقسام "حظ أوفر" بنسبة إجمالية 98%
                const noWinIndexes = [1, 2, 3, 4, 5, 6, 7, 8];
                selectedIndex = noWinIndexes[Math.floor(Math.random() * noWinIndexes.length)];
            }

            const targetAngleOnCircle = (numPrizes - selectedIndex - 0.5) * arc - (Math.PI / 2);
            const extraRounds = 6 * 2 * Math.PI; 
            const currentAngleMod = startAngle % (2 * Math.PI);
            const targetTotalAngle = startAngle + extraRounds + (targetAngleOnCircle - currentAngleMod);

            let duration = 4000;
            let startTime = null;
            let initialAngle = startAngle;

            function animateWheel(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = (timestamp - startTime) / duration;

                if (progress < 1) {
                    let easeProgress = 1 - Math.pow(1 - progress, 3);
                    startangle_val = initialAngle + (targetTotalAngle - initialAngle) * easeProgress;
                    startAngle = startangle_val;
                    drawWheel();
                    requestAnimationFrame(animateWheel);
                } else {
                    startAngle = targetTotalAngle;
                    drawWheel();
                    finishSpin(prizes[selectedIndex]);
                }
            }

            requestAnimationFrame(animateWheel);
        }

        function finishSpin(prize) {
            isSpinning = false;
            if (userSpins > 0) {
                document.getElementById("spinBtn").disabled = false;
            }
            
            const resultDiv = document.getElementById("result");
            const cleanName = prize.name.replace('\n', ' ');

            if (prize.type === "no_win") {
                resultDiv.className = "lose-text";
                resultDiv.innerText = "😔 حظ أوفر في المرة القادمة!";
            } else {
                resultDiv.className = "win-text";
                resultDiv.innerText = "🎉 مبروك! لقد حصلت على: " + cleanName;
            }

            setTimeout(() => {
                if (tg) {
                    tg.sendData(JSON.stringify({
                        action: "wheel_spin_result",
                        prize_name: cleanName,
                        prize_type: prize.type,
                        prize_value: prize.val
                    }));
                }
            }, 1500);
        }

        drawWheel();
        if (userSpins <= 0) {
            document.getElementById("spinBtn").disabled = true;
        }
    </script>
</body>
</html>
